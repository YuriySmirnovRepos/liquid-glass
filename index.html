<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b15" />
    <title>Liquid Glass / WebGL2</title>
  </head>

  <body>
    <canvas id="liquid-canvas" aria-hidden="true"></canvas>

    <main class="stage">
      <section class="glass-card" aria-labelledby="title">
        <p class="eyebrow">Liquid Glass · WebGL2</p>

        <h1 id="title">Render pipeline готов</h1>

        <p class="description">
          Первый шаг: проверяем WebGL2, корректный canvas resize и
          device-pixel-ratio.
        </p>

        <button type="button" id="test-button">Включить рефракцию</button>
      </section>
    </main>

    <!-- Телеметрия обновляется 2 раза в секунду и не должна попадать
         в live-регион, иначе скринридер зачитывает её непрерывно. -->
    <div id="fps" class="badge badge--fps" aria-hidden="true">— FPS</div>

    <output id="status" class="badge badge--status" aria-live="polite">
      Инициализация…
    </output>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
